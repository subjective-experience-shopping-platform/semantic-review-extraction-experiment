[project]
license = "GPL-3.0-only"
name = "semantic-review-extraction-experiment"
version = "0.1.0"
description = "Korean review extraction, A-D clustering experiments, and human evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "sentence-transformers>=3.4",
    "torch>=2.5",
    "huggingface-hub>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
user-evaluation = ["streamlit>=1.52"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_review_extraction_experiment"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "models", "results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
